[project]
name = "tracker-mining"
version = "0.1.0"
description = "Capstone project: link-analysis of the tracker ecosystem in Vietnam"
requires-python = ">=3.10"
# Bornes basses = versions testées dans l'environnement de développement.
dependencies = [
    "playwright>=1.56",
    "psutil>=7.0",
    "tldextract>=5.4",
    "networkx>=3.4",
    "scipy>=1.14",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "pyarrow>=18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: test d'intégration qui lance Chromium (lent, ~30 s)"]
addopts = "-m 'not browser'"