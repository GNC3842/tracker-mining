[build-system]
requires = ["setuptools >= 68]
build-backend = "setuptools.build_meta"

[project]
name = "tracker-mining"
version = "0.0.1"
description = "Capstone project: link-analysis of the tracker ecosystem in Vietnam"
requires-python = ">=3.10"
dependencies = [
  "playwright=1.64.1",
  "pandas=3.1.0",
  "networkx=3.7",
  "numpy=2.5.4",
  "psutil=7.2.2",
  "pyarrow=26.0.0",
  "pyyaml=6.0.3",
  "scikit-learn=1.9.1",
  "scipy=1.18.1",
  "tdlextract=5.4.0"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: test d'intégration qui lance Chromium (lent, ~30 s)"]
addopts = "-m 'not browser'"
